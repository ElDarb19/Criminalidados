<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criminal Dice / Crimen Urbano</title>
  
  <!-- Hoja de estilos del juego -->
  <link rel="stylesheet" href="styles.css">

  <!-- Firebase SDKs (Versión v9 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- Configuración de Firebase (Reemplaza con tus credenciales de consola) -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCEY_P4mC8xArf88rRBYyI-JZ_M74o6FuE",
      authDomain: "criminalidados-243e6.firebaseapp.com",
      databaseURL: "https://criminalidados-243e6-default-rtdb.firebaseio.com",
      projectId: "criminalidados-243e6",
      storageBucket: "criminalidados-243e6.firebasestorage.app",
      messagingSenderId: "375013954181",
      appId: "1:375013954181:web:1d1a5d6ce1990454c04fec"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
  </script>
</head>
<body>

  <!-- Contenedor Principal con Game Juice (Screen Shake Target) -->
  <div class="game-container">
    
    <!-- Toast de Notificaciones -->
    <div id="gameNotification" class="notification-toast"></div>

    <!-- Barra de Estado Superior -->
    <header class="game-header">
      <div class="header-brand">
        <h1 class="game-title">CRIMINAL DICE</h1>
        <span class="game-subtitle">CRIMEN URBANO</span>
      </div>
      <div class="header-status">
        <span id="playerUidBadge" class="badge badge-auth" title="Tu UID de Firebase">Conectando...</span>
        <span id="currentRoomCode" class="badge badge-room">SIN SALA</span>
      </div>
    </header>

    <!-- ========================================== -->
    <!-- 1. SECCIÓN DE LOBBY / SELECCIÓN DE MODOS   -->
    <!-- ========================================== -->
    <main id="lobbySection" class="game-section">
      
      <!-- Panel de Perfil de Jugador -->
      <section class="panel-box">
        <h2 class="panel-title">PERFIL DEL CAPO</h2>
        <div style="display: flex; gap: 15px; flex-wrap: wrap;">
          <div style="flex: 1; min-width: 200px;">
            <label style="font-size: 0.8rem; color: var(--text-muted); font-weight: bold; margin-bottom: 5px; display: block;">NOMBRE (ALIAS):</label>
            <input type="text" id="inputPlayerName" class="input-room" placeholder="Capo..." maxlength="15">
          </div>
          <div style="flex: 1; min-width: 200px;">
            <label style="font-size: 0.8rem; color: var(--text-muted); font-weight: bold; margin-bottom: 5px; display: block;">COLOR / BANDO:</label>
            <select id="selectPlayerColor" class="input-room" style="cursor: pointer;">
              <option value="Color_R">🔴 Rojo</option>
              <option value="Color_B">🔵 Azul</option>
              <option value="Color_G">🟢 Verde</option>
              <option value="Color_P">🌸 Rosa</option>
              <option value="Color_Pu">🟣 Morado</option>
              <option value="Color_W">⚪ Blanco</option>
            </select>
          </div>
        </div>
      </section>

      <!-- Panel de Contratos (Minijuegos) -->
      <section class="panel-box">
        <h2 class="panel-title">SELECCIONAR CONTRATO</h2>
        <div class="contract-selector-grid">
          <button class="btn-contract btn-select-contract active" data-contract="guerra_bandas">
            <span class="contract-icon">💥</span>
            <strong>Guerra de Bandas</strong>
            <small>Duelo directo de dados y daño crítico</small>
          </button>
          <button class="btn-contract btn-select-contract" data-contract="gran_atraco">
            <span class="contract-icon">🏦</span>
            <strong>El Gran Atraco</strong>
            <small>Arriesga tu botín o escapa a tiempo</small>
          </button>
          <button class="btn-contract btn-select-contract" data-contract="imperio_criminal">
            <span class="contract-icon">🏙️</span>
            <strong>Imperio Criminal</strong>
            <small>Asalta distritos y cobra dividendos</small>
          </button>
          <button class="btn-contract btn-select-contract" data-contract="apuestas_clandestinas">
            <span class="contract-icon">🎲</span>
            <strong>Apuestas Clandestinas</strong>
            <small>Par, impar o alto en el bajo mundo</small>
          </button>
        </div>
      </section>

      <!-- Panel de Modos Locales y Solo -->
      <section class="panel-box">
        <h2 class="panel-title">OPERACIONES LOCALES</h2>
        <div class="actions-grid">
          <button id="btnModeLocal" class="btn-action">
            Partida Local (1v1 Mismo Dispositivo)
          </button>
          <button id="btnModeAI" class="btn-action btn-secondary">
            Solo vs Don Salieri (IA)
          </button>
        </div>
      </section>

      <!-- Panel Multijugador Online (Firebase RTDB) -->
      <section class="panel-box online-panel">
        <h2 class="panel-title">SINDICATO ONLINE</h2>
        <div class="online-actions-flow">
          <div class="online-flow-item">
            <button id="btnCreateOnlineRoom" class="btn-action btn-online-action" disabled>
              Crear Nueva Sala Online
            </button>
          </div>
          <div class="online-flow-divider">O</div>
          <div class="online-flow-item join-group">
            <input 
              type="text" 
              id="inputRoomCode" 
              class="input-room" 
              placeholder="CÓDIGO (Ej: CD-4921)" 
              maxlength="10" 
              autocomplete="off"
              spellcheck="false"
            >
            <button id="btnJoinOnlineRoom" class="btn-action btn-online-action" disabled>
              Unirse a Sala
            </button>
          </div>
        </div>
        
        <!-- Botón del Host para comenzar la partida online -->
        <div class="host-controls">
          <button id="btnStartOnlineMatch" class="btn-action btn-success" style="display: none;" disabled>
            Iniciar Asalto Online
          </button>
        </div>
      </section>

    </main>

    <!-- ========================================== -->
    <!-- 2. SECCIÓN DE BATALLA / TABLERO ACTIVO     -->
    <!-- ========================================== -->
    <main id="battleSection" class="game-section" style="display: none;">
      
      <!-- Encabezado de Turno y Contrato -->
      <div class="battle-header-bar">
        <div class="contract-indicator">
          <span>CONTRATO ACTIVO:</span>
          <strong id="contractTitle">GUERRA DE BANDAS</strong>
        </div>
        <div id="turnStatusLabel" class="turn-status-badge">
          Determinando turno...
        </div>
      </div>

      <!-- Tablero Central -->
      <div id="gameBoard" class="game-board">
        
        <!-- Contenedor Dinámico de Tarjetas de Jugador (players[uid]) -->
        <div id="playersContainer" class="players-container"></div>

        <!-- Zona del Dado / Acción Central -->
        <div class="dice-arena">
          <div id="diceContainer" class="dice-container">
            <div class="dice-face" id="diceVisual">🎲</div>
          </div>
        </div>

        <!-- Panel de Acciones Específicas del Contrato Activo -->
        <div id="contractPanel" class="contract-panel"></div>

      </div>

      <!-- Barra Inferior de Navegación -->
      <footer class="battle-footer">
        <button id="btnExitBattle" class="btn-action btn-danger btn-sm" onclick="resetToMainMenu()">
          Abandonar Partida
        </button>
      </footer>

    </main>

  </div>

  <!-- Motor Principal del Juego -->
  <script src="game.js"></script>
</body>
</html>
